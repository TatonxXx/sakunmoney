<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแปลงสกุลเงิน</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1, h2 {
            text-align: center;
        }

        .box {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            font-size: 15px;
        }

        .reset {
            background: #3498db;
            color: white;
        }

        .clear {
            background: #e74c3c;
            color: white;
        }

        .status {
            text-align: center;
            margin: 15px 0;
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #eee;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ระบบแปลงสกุลเงิน</h1>

    <div class="box">
        <label>THB (บาท)</label>
        <input type="number" id="thb" placeholder="กรอกจำนวน THB">
    </div>

    <div class="box">
        <label>USD (ดอลลาร์)</label>
        <input type="number" id="usd" placeholder="กรอกจำนวน USD">
    </div>

    <div class="box">
        <label>อัตราแลกเปลี่ยน</label>
        <input type="number" id="rate" value="0.02817" step="0.00001">
    </div>

    <div style="text-align:center;">
        <button class="reset" onclick="resetNumbers()">
            ล้างตัวเลขเป็นค่าเริ่มต้น
        </button>

        <button class="clear" onclick="clearHistory()">
            ล้างข้อมูล
        </button>
    </div>

    <div class="status" id="status">
        พร้อมใช้งาน
    </div>

    <h2>ประวัติการแปลงเงิน 10 รายการล่าสุด</h2>

    <table>
        <thead>
            <tr>
                <th>THB</th>
                <th>USD</th>
                <th>อัตราแลกเปลี่ยน</th>
                <th>เวลา</th>
            </tr>
        </thead>

        <tbody id="history"></tbody>
    </table>

</div>

<script>

    const thbInput = document.getElementById("thb");
    const usdInput = document.getElementById("usd");
    const rateInput = document.getElementById("rate");
    const historyTable = document.getElementById("history");
    const statusText = document.getElementById("status");

    const defaultRate = 0.02817;

    let history = JSON.parse(localStorage.getItem("currencyHistory")) || [];

    let saveTimer = null;

    // แปลง THB -> USD
    thbInput.addEventListener("input", function () {

        if (this.value === "") {
            usdInput.value = "";
            return;
        }

        const thb = parseFloat(this.value);
        const rate = parseFloat(rateInput.value);

        if (!isNaN(thb) && !isNaN(rate)) {
            usdInput.value = (thb * rate).toFixed(2);
            scheduleSave();
        }
    });

    // แปลง USD -> THB
    usdInput.addEventListener("input", function () {

        if (this.value === "") {
            thbInput.value = "";
            return;
        }

        const usd = parseFloat(this.value);
        const rate = parseFloat(rateInput.value);

        if (!isNaN(usd) && !isNaN(rate) && rate !== 0) {
            thbInput.value = (usd / rate).toFixed(2);
            scheduleSave();
        }
    });

    // เมื่อเปลี่ยนอัตราแลกเปลี่ยน
    rateInput.addEventListener("input", function () {

        const rate = parseFloat(this.value);

        if (isNaN(rate) || rate <= 0) {
            return;
        }

        if (thbInput.value !== "") {
            const thb = parseFloat(thbInput.value);
            usdInput.value = (thb * rate).toFixed(2);
        }
        else if (usdInput.value !== "") {
            const usd = parseFloat(usdInput.value);
            thbInput.value = (usd / rate).toFixed(2);
        }

        scheduleSave();
    });

    // บันทึกหลังจากหยุดกรอก 5 วินาที
    function scheduleSave() {

        clearTimeout(saveTimer);

        statusText.textContent = "รอบันทึกประวัติ 5 วินาที...";

        saveTimer = setTimeout(function () {

            if (thbInput.value === "" || usdInput.value === "") {
                return;
            }

            const record = {
                thb: parseFloat(thbInput.value),
                usd: parseFloat(usdInput.value),
                rate: parseFloat(rateInput.value),
                time: new Date().toLocaleString("th-TH")
            };

            history.unshift(record);

            // เก็บเฉพาะ 10 รายการล่าสุด
            history = history.slice(0, 10);

            localStorage.setItem(
                "currencyHistory",
                JSON.stringify(history)
            );

            renderHistory();

            statusText.textContent = "บันทึกประวัติเรียบร้อยแล้ว";

        }, 5000);
    }

    // แสดงประวัติ
    function renderHistory() {

        historyTable.innerHTML = "";

        history.forEach(function(record) {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${record.thb.toFixed(2)}</td>
                <td>${record.usd.toFixed(2)}</td>
                <td>${record.rate}</td>
                <td>${record.time}</td>
            `;

            historyTable.appendChild(row);
        });
    }

    // ล้างตัวเลขเป็นค่าเริ่มต้น
    function resetNumbers() {

        clearTimeout(saveTimer);

        thbInput.value = "";
        usdInput.value = "";
        rateInput.value = defaultRate;

        statusText.textContent = "คืนค่าเป็นค่าเริ่มต้นแล้ว";
    }

    // ล้างประวัติทั้งหมด
    function clearHistory() {

        clearTimeout(saveTimer);

        history = [];

        localStorage.removeItem("currencyHistory");

        renderHistory();

        statusText.textContent = "ล้างข้อมูลประวัติแล้ว";
    }

    renderHistory();

</script>

</body>
</html>
